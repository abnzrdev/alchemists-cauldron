name: Quality

on:
  pull_request:
  push:
    branches: [story-2, story-3, story-4]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm exec stylelint "src/**/*.{css,scss}"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
